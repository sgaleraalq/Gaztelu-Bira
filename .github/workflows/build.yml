# Compiles the Android app (debug) on every push and PR against main.
# No tests, lint, deploy or release signing: it only checks that the app builds.

name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  assemble-debug:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # gradle/gradle-daemon-jvm.properties pins the daemon to JDK 25; installing it here
      # lets Gradle find it instead of downloading a toolchain on every run.
      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # Open-source provider over actions/cache, free for private repos too.
          cache-provider: basic

      # google-services.json is gitignored; the google-services plugin fails the build without it.
      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES_JSON_DEBUG: ${{ secrets.GOOGLE_SERVICES_JSON_DEBUG }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_DEBUG" ]; then
            echo "::error::Missing secret GOOGLE_SERVICES_JSON_DEBUG (base64 of android/gaztelu_bira/google-services.json)"
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON_DEBUG" | base64 --decode > gaztelu_bira/google-services.json

      - name: Assemble debug
        run: ./gradlew :gaztelu_bira:assembleDebug
